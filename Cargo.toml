[package]
name = "faster_elevation"
version = "0.3.0"
edition = "2021"

[dependencies]
gdal = "0.18.0"
geozero = { version = "0.14.0", features = ["with-postgis-postgres"] }
geo = "0.30.0"
walkdir = "2.5.0"
clap = { version = "4.5.37", features = ["derive"] }
exitcode = "1.1.2"
http = "1.3.1"
axum = "0.8.4"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0",features = ["full"] }
bb8 = "0.9.0"
bb8-postgres = "0.9.0"
tokio-postgres = "0.7.13"
axum-macros = "0.5.0"
moka = { version = "0.12.10", features = ["future"] }
async-trait = "0.1.88"